{{define "content"}}
<div class="auth-card">
  <div class="auth-logo">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
  </div>
  <div class="auth-heading">
    <h1>欢迎使用 logd</h1>
    <p>请输入管理员访问密码以进入监控平台</p>
  </div>
  {{if .Error}}<div class="msg-alert error">{{.Error}}</div>{{end}}
  <form method="post" action="/admin/login" style="display: flex; flex-direction: column; gap: 14px;">
    <div>
      <input class="form-input" type="password" name="password" required autofocus autocomplete="current-password" placeholder="输入管理密码">
    </div>
    <button class="btn btn-primary" type="submit" style="width: 100%; height: 34px;">进入控制台</button>
  </form>
</div>
{{end}}
